name: Image build and push workflow

permissions:
  id-token: write
  contents: read

on:
  push:
    paths:
      - 'module04/app/**'

jobs:
  image-build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'module04/app'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_ECR_PUSH }}
          aws-region: "eu-west-2"
      - name: ECR login
        uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/website/demo:${{ github.sha }}
